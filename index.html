<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<title>Generador de instrucciones BIOOMA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
  /* Panel de datos a la izquierda, hoja Letter a la derecha. Fondo blanco, un solo tema claro. */
  :root{
    --navy:#2B2E82; --teal:#6FC0C8; --sky:#4D9FDD; --tealbg:#EAF6F7;
    --bg:#FFFFFF; --card:#FFFFFF; --field:#FFFFFF; --ink:#0E1230; --head:#2B2E82; --line:#D9DFEA; --muted:#5B6280;
    --warn:#B45309; --warnbg:#FFF4E0; --btn:#2B2E82; --btn-ink:#fff; --link:#3E86C4; --okink:#1D5F66;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,"Segoe UI",Arial,sans-serif}
  .app{display:grid;grid-template-columns:380px 1fr;gap:24px;max-width:1280px;margin:0 auto;padding-block:24px;padding-inline:16px}
  .app > *{min-width:0}
  @media(max-width:900px){.app{grid-template-columns:1fr}}

  /* ---------- panel de datos ---------- */
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;align-self:start;position:sticky;top:16px}
  @media(max-width:900px){.panel{position:static}}
  .panel h1{font:700 22px/1.2 "Playfair Display",Georgia,serif;color:var(--head);margin:0 0 4px}
  .panel .sub{color:var(--muted);font-size:13px;margin:0 0 16px}
  fieldset{border:0;padding:0;margin:0 0 14px}
  legend{font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--head);margin-bottom:8px;padding:0}
  label{display:block;font-size:13px;font-weight:500;margin:0 0 10px}
  input,select,textarea{display:block;width:100%;margin-top:4px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;color:inherit;background:var(--field)}
  input:focus-visible,select:focus-visible,textarea:focus-visible,.btn:focus-visible{outline:2px solid var(--teal);outline-offset:1px;border-color:var(--teal)}
  textarea{resize:vertical;min-height:60px}
  .row{display:grid;grid-template-columns:1fr 92px;gap:8px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .chk{display:flex;align-items:center;gap:8px;font-weight:400;margin:0 0 5px;cursor:pointer}
  .chk input{width:auto;margin:0}
  .hint{font-size:12px;color:var(--muted);margin:-4px 0 10px}
  .hint.warn{color:var(--warn)}
  .hint button{all:unset;color:var(--link);cursor:pointer;text-decoration:underline}
  .btn{display:block;width:100%;padding:12px;border:0;border-radius:10px;background:var(--btn);color:var(--btn-ink);font:600 15px Inter,sans-serif;cursor:pointer}
  .btn:hover{filter:brightness(1.12)}
  .btn:disabled{opacity:.6;cursor:progress}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);margin-top:8px;font-weight:500}
  .err{display:none;background:var(--warnbg);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:10px}
  .err.on{display:block}
  .ok{display:none;background:var(--tealbg);color:var(--okink);border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:10px}
  .ok.on{display:block}

  /* ---------- hoja (vista previa = lo que se imprime) ---------- */
  .stage{overflow-x:auto}
  .hoja{--ink:#0E1230;--line:#D9DFEA;--muted:#5B6280;--warn:#B45309;--warnbg:#FFF4E0;--navy:#2B2E82;--tealbg:#EAF6F7;
    width:8.5in;min-height:11in;margin:0 auto;background:#fff;padding:.4in .6in;box-shadow:0 2px 18px rgba(14,18,48,.14);color:var(--ink);font-size:9.5pt;line-height:1.3;position:relative}
  .borrador{background:var(--warnbg);color:var(--warn);border:1px solid #F1C98A;border-radius:6px;padding:6px 10px;font-size:9pt;font-weight:600;margin-bottom:10px;text-align:center}
  .enc{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:8px}
  .enc img{height:.85in;width:auto;display:block}
  .enc .tit{text-align:right}
  .enc h2{font:700 21pt/1.15 "Playfair Display",Georgia,serif;color:var(--navy);margin:0}
  .enc .prod{color:var(--muted);font-size:10pt;margin-top:2px}
  .contactos{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 18px;font-size:8.5pt;color:var(--muted);border-bottom:3px solid var(--teal);padding-bottom:8px;margin:0 0 8px}
  .contactos b{color:var(--navy);font-weight:600}
  h3{font:600 9pt/1 Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--navy);margin:10px 0 5px;padding-bottom:4px;border-bottom:1px solid var(--line)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px 20px}
  .kv span{display:block;font-size:8pt;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .kv b{font-weight:600}
  .plan{background:var(--tealbg);border-left:4px solid var(--teal);border-radius:6px;padding:9px 14px;display:grid;grid-template-columns:1fr 1fr;gap:6px 24px;margin-top:4px}
  .plan .big{font:700 18pt/1.1 "Playfair Display",Georgia,serif;color:var(--navy)}
  .plan .src{grid-column:1/-1;font-size:8.5pt;color:var(--muted)}
  .mezTxt{font:700 13pt/1.25 "Playfair Display",Georgia,serif;color:var(--navy);background:var(--tealbg);border-left:4px solid var(--teal);border-radius:6px;padding:7px 14px;white-space:pre-wrap}
  .nota{margin:6px 0 0;white-space:pre-wrap}
  ol,ul{margin:0;padding-left:1.25em}
  li{margin-bottom:3px}
  .pend{background:var(--warnbg);color:var(--warn);padding:0 5px;border-radius:3px;font-weight:600}
  section{break-inside:avoid}

  /* ---------- impresión: solo la hoja ---------- */
  @page{size:Letter;margin:0}
  @media print{
    body{background:#fff}
    .app{display:block;padding:0;max-width:none}
    .panel{display:none}
    .stage{overflow:visible}
    .hoja{box-shadow:none;margin:0;width:auto;min-height:0;padding:.4in .6in;zoom:1 !important}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
<div class="app">

  <form class="panel" id="f" autocomplete="off" onsubmit="return false">
    <h1>Instrucciones de aplicación</h1>
    <p class="sub">Llene los datos del cliente. La hoja de la derecha se actualiza sola.</p>

    <fieldset>
      <legend>Producto y sistema</legend>
      <label>Producto
        <select id="producto"></select>
      </label>
      <label>Tipo de sistema
        <select id="sistema"></select>
      </label>
      <label>Volumen del sistema
        <div class="row">
          <input id="volumen" type="number" min="0" step="any" placeholder="Ej. 5">
          <select id="volUnidad"><option value="m3">m³</option><option value="L">litros</option></select>
        </div>
      </label>
      <label>Carga
        <select id="carga"></select>
      </label>
      <label>Descripción de la carga <span style="color:var(--muted);font-weight:400">(opcional)</span>
        <input id="cargaDesc" type="text" placeholder="Ej. 6 personas, restaurante con 80 platos/día">
      </label>
    </fieldset>

    <fieldset>
      <legend>Lugar de aplicación</legend>
      <div id="lugares"></div>
      <input id="lugarOtro" type="text" placeholder="Otro lugar (opcional)">
    </fieldset>

    <fieldset>
      <legend>Aplicación</legend>
      <label>Cantidad por aplicación
        <div class="row">
          <input id="cantidad" type="number" min="0" step="any">
          <select id="cantUnidad"><option value="">—</option><option>g</option><option>kg</option><option>mL</option><option>L</option></select>
        </div>
      </label>
      <p class="hint" id="cantHint"></p>
      <label>Frecuencia
        <input id="frecuencia" type="text" placeholder="Ej. cada 15 días">
      </label>
      <p class="hint" id="frecHint"></p>
    </fieldset>

    <fieldset>
      <legend>Mezcla</legend>
      <label class="chk"><input type="checkbox" id="sinDiluir"> Se aplica sin diluir</label>
      <label>Proporción de mezcla
        <input id="mezTexto" type="text" placeholder="Ej. 1 parte de producto por 10 de agua">
      </label>
      <p class="hint" id="mezHint"></p>
    </fieldset>

    <fieldset>
      <legend>Cómo aplicar</legend>
      <label>Nota de cómo aplicar <span style="color:var(--muted);font-weight:400">(opcional)</span>
        <textarea id="notaAplicar" placeholder="Ej. Aplicar por la noche, con el sistema sin uso"></textarea>
      </label>
    </fieldset>

    <fieldset>
      <legend>Cliente y documento</legend>
      <label>Cliente <input id="cliente" type="text"></label>
      <label>Sitio / ubicación <input id="sitio" type="text"></label>
      <label>Fecha <input id="fecha" type="date"></label>
      <label>Elaborado por <input id="autor" type="text"></label>
      <label>Observaciones <span style="color:var(--muted);font-weight:400">(opcional)</span>
        <textarea id="obs"></textarea>
      </label>
    </fieldset>

    <div class="err" id="err" role="alert"></div>
    <div class="ok" id="ok" role="status"></div>
    <button class="btn" id="pdf" type="button">Descargar PDF</button>
    <button class="btn ghost" id="imprimir" type="button" hidden>Imprimir o guardar con texto seleccionable</button>
    <button class="btn ghost" id="limpiar" type="button">Limpiar formulario</button>
    <p class="hint" style="margin-top:10px" id="pdfHint"></p>
  </form>

  <div class="stage" id="stage"><article class="hoja" id="hoja"></article></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/* ============================================================
   REGLAS DE APLICACIÓN BIOOMA  ·  este es el ÚNICO archivo que se edita
   para cambiar dosis, frecuencias, pasos, contactos o textos.
   Después de editar, correr:  python build.py
   ------------------------------------------------------------
   - null  = "regla sin definir". El generador pide el dato a mano
             y marca el PDF como BORRADOR.
   - validado: false  = el PDF lleva la franja "BORRADOR". Cámbialo a true
             SOLO cuando el equipo técnico haya confirmado todo el producto.
   - Los pasos y el texto de almacenamiento son borrador mío, sin aprobar.
   ============================================================ */
window.REGLAS = {
  version: '0.2',

  /* Dirección de la versión web (GitHub Pages). El artifact de claude.ai la muestra cuando el visor no deja descargar. */
  urlWeb: 'https://zakymq-1214.github.io/biooma-instrucciones/',

  contacto: {
    whatsapp: ['+57 300 859 2542', '+57 311 339 7693'],
    redes: 'biooma.biotech',          // Instagram y Facebook
    web: 'biooma.com'
  },

  /* TIPOS DE SISTEMA: iguales para todos los productos. */
  sistemas: {
    septico:    'Sistema séptico',
    ptar:       'Planta de tratamiento de agua residual (PTAR)',
    laguna:     'Laguna de oxidación',
    compostaje: 'Compostaje'
  },

  /* Valores de "carga" que verá el usuario. */
  cargas: {
    baja:  'Baja',
    media: 'Media',
    alta:  'Alta'
  },

  /* LUGARES DE APLICACIÓN: casillas (se pueden marcar varios).
     Para agregar uno: una línea nueva  clave: 'Texto que sale en el PDF'. */
  lugares: {
    banos:         'Baños (inodoros)',
    lavamanos:     'Lavamanos',
    lavaplatos:    'Lavaplatos / cocina',
    trampa:        'Trampa de grasa (directo)',
    pozo:          'Pozo séptico (directo)',
    cribado:       'Cribado (PTAR)',
    homogenizador: 'Tanque homogenizador'
  },

  /* PASOS de "Cómo aplicar": iguales para todos los productos.
     Un producto puede traer su propia lista en `pasos:` y reemplaza a esta.
     Marcadores: {cantidad}  {lugar}  {frecuencia} */
  pasos: [
    'Confirme los datos del sistema (tipo, volumen y carga) con el cliente antes de aplicar.',
    'Mida la cantidad indicada en este documento: {cantidad}.',
    'Aplique el producto en: {lugar}.',
    'Repita la aplicación con la frecuencia indicada: {frecuencia}.'
  ],

  /* PRODUCTOS. logo: clave de la imagen (septic-s, septic-l, ag o biooma = logo general).
     Cuando lleguen los logos de 700/800, TG y Compost se cambia `logo` y se agrega la imagen en assets/. */
  productos: {

    'septic-s': {
      nombre: 'Biooma Septic S',
      logo: 'septic-s',
      validado: false,
      /* DOSIS  =  volumen (m³) × porM3 × factorCarga[carga] */
      dosis: { unidad: null, porM3: null, factorCarga: { baja: null, media: null, alta: null } },
      frecuencia: { baja: null, media: null, alta: null },      // texto, p. ej. 'cada 15 días'
      mezcla: { texto: null, notas: [] },                        // texto libre, p. ej. '1 parte por 10 de agua'
      /* porSistema: { ptar: { dosis: {...}, frecuencia: {...}, mezcla: {...} } }  ← opcional, reemplaza lo general */
      almacenamiento: 'Conserve el producto en su empaque original, cerrado, en un lugar fresco y seco, fuera del alcance de niños y animales.'
    },

    'septic-l': {
      nombre: 'Biooma Septic L',
      logo: 'septic-l',
      validado: false,
      dosis: { unidad: null, porM3: null, factorCarga: { baja: null, media: null, alta: null } },
      frecuencia: { baja: null, media: null, alta: null },
      mezcla: { texto: null, notas: [] },
      almacenamiento: 'Conserve el producto en su empaque original, cerrado, en un lugar fresco y seco, fuera del alcance de niños y animales.'
    },

    'ag': {
      nombre: 'Biooma AG',
      logo: 'ag',
      validado: false,
      dosis: { unidad: null, porM3: null, factorCarga: { baja: null, media: null, alta: null } },
      frecuencia: { baja: null, media: null, alta: null },
      mezcla: { texto: null, notas: [] },
      almacenamiento: 'Conserve el producto en su empaque original, cerrado, en un lugar fresco y seco, fuera del alcance de niños y animales.'
    },

    '700-800': {
      nombre: 'Biooma 700/800',
      logo: 'biooma',                    // pendiente: logo propio
      validado: false,
      dosis: { unidad: null, porM3: null, factorCarga: { baja: null, media: null, alta: null } },
      frecuencia: { baja: null, media: null, alta: null },
      mezcla: { texto: null, notas: [] },
      almacenamiento: 'Conserve el producto en su empaque original, cerrado, en un lugar fresco y seco, fuera del alcance de niños y animales.'
    },

    'tg': {
      nombre: 'Biooma TG',
      logo: 'biooma',                    // pendiente: logo propio
      validado: false,
      dosis: { unidad: null, porM3: null, factorCarga: { baja: null, media: null, alta: null } },
      frecuencia: { baja: null, media: null, alta: null },
      mezcla: { texto: null, notas: [] },
      almacenamiento: 'Conserve el producto en su empaque original, cerrado, en un lugar fresco y seco, fuera del alcance de niños y animales.'
    },

    'compost': {
      nombre: 'Biooma Compost',
      logo: 'biooma',                    // pendiente: logo propio
      validado: false,
      dosis: { unidad: null, porM3: null, factorCarga: { baja: null, media: null, alta: null } },
      frecuencia: { baja: null, media: null, alta: null },
      mezcla: { texto: null, notas: [] },
      almacenamiento: 'Conserve el producto en su empaque original, cerrado, en un lugar fresco y seco, fuera del alcance de niños y animales.'
    }
  }
};

<script>
(function(){
  var R = window.REGLAS, LOGOS = window.LOGOS || {};
  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
  var fmt = function(n){ return Number(n).toLocaleString('es-CO', {maximumFractionDigits: 2}); };
  var cantidadTocada = false, frecuenciaTocada = false, mezclaTocada = false;

  /* ---------- selects ---------- */
  function fill(sel, pairs){ sel.innerHTML = pairs.map(function(p){
    return '<option value="'+esc(p[0])+'">'+esc(p[1])+'</option>'; }).join(''); }
  fill($('producto'), Object.keys(R.productos).map(function(k){ return [k, R.productos[k].nombre]; }));
  fill($('carga'), Object.keys(R.cargas).map(function(k){ return [k, R.cargas[k]]; }));
  $('carga').value = 'media';
  fill($('sistema'), Object.keys(R.sistemas).map(function(k){ return [k, R.sistemas[k]]; }));

  $('lugares').innerHTML = Object.keys(R.lugares).map(function(k){
    return '<label class="chk"><input type="checkbox" data-lugar="'+esc(k)+'"> '+esc(R.lugares[k])+'</label>'; }).join('');
  function lugares(){
    var l = [].slice.call(document.querySelectorAll('[data-lugar]:checked')).map(function(c){ return R.lugares[c.getAttribute('data-lugar')]; });
    var otro = $('lugarOtro').value.trim(); if (otro) l.push(otro);
    return l;
  }

  function prod(){ return R.productos[$('producto').value]; }
  function sis(){ var k = $('sistema').value; return { clave: k, etiqueta: R.sistemas[k] }; }
  function ovr(p){ return (p.porSistema && p.porSistema[$('sistema').value]) || {}; }
  /* ---------- reglas ---------- */
  function volumenM3(){
    var v = parseFloat($('volumen').value);
    if (!(v > 0)) return null;
    return $('volUnidad').value === 'L' ? v/1000 : v;
  }
  function calcular(){
    var p = prod(), o = ovr(p), v = volumenM3();
    var d = o.dosis || p.dosis, c = $('carga').value;
    var factor = d.factorCarga ? d.factorCarga[c] : null;
    var frec = (o.frecuencia || p.frecuencia)[c];
    var cant = (v != null && d.porM3 != null && factor != null) ? Math.round(v * d.porM3 * factor * 100) / 100 : null;
    return { cantidad: cant, unidad: d.unidad, frecuencia: frec };
  }

  function mezclaRegla(){
    var p = prod(), o = ovr(p), m = o.mezcla || p.mezcla || {};
    return { texto: m.texto != null ? m.texto : null, notas: m.notas || [] };
  }

  /* ---------- sincroniza cantidad / frecuencia con las reglas ---------- */
  function sync(){
    var c = calcular();
    if (!cantidadTocada){
      $('cantidad').value = c.cantidad != null ? c.cantidad : '';
      if (c.unidad) $('cantUnidad').value = c.unidad;
    }
    if (!frecuenciaTocada) $('frecuencia').value = c.frecuencia || '';

    var h = $('cantHint');
    if (c.cantidad == null){
      h.className = 'hint warn';
      h.textContent = 'Sin regla de dosis definida para este caso: ingrese la cantidad a mano.';
    } else if (cantidadTocada && parseFloat($('cantidad').value) !== c.cantidad){
      h.className = 'hint';
      h.innerHTML = 'Valor manual. La tabla BIOOMA da ' + fmt(c.cantidad) + ' ' + esc(c.unidad||'') + '. <button type="button" id="usarCalc">Usar el calculado</button>';
      $('usarCalc').onclick = function(){ cantidadTocada = false; sync(); render(); };
    } else {
      h.className = 'hint';
      h.textContent = 'Calculada con la tabla de reglas BIOOMA (puede editarla).';
    }
    var m = mezclaRegla(), ok = m.texto != null;
    if (!mezclaTocada) $('mezTexto').value = ok ? m.texto : '';
    $('mezTexto').disabled = $('sinDiluir').checked;
    var mh = $('mezHint');
    if ($('sinDiluir').checked){ mh.className = 'hint'; mh.textContent = ''; }
    else if (!ok){ mh.className = 'hint warn'; mh.textContent = 'Sin regla de mezcla definida: escriba la proporción.'; }
    else if (mezclaTocada && $('mezTexto').value !== m.texto){
      mh.className = 'hint'; mh.innerHTML = 'Texto manual. La tabla BIOOMA dice: ' + esc(m.texto) + '. <button type="button" id="usarMez">Usar el de la tabla</button>';
      $('usarMez').onclick = function(){ mezclaTocada = false; sync(); render(); };
    } else { mh.className = 'hint'; mh.textContent = 'Tomada de la tabla de reglas BIOOMA (puede editarla).'; }
    $('frecHint').className = 'hint' + (c.frecuencia ? '' : ' warn');
    $('frecHint').textContent = c.frecuencia ? '' : 'Sin regla de frecuencia definida: escríbala a mano.';
  }

  /* ---------- la hoja ---------- */
  function val(v){ return v ? esc(v) : '<span class="pend">Por definir</span>'; }
  function render(){
    var p = prod(), s = sis(), c = calcular(), lug = lugares();
    var cant = parseFloat($('cantidad').value), unidad = $('cantUnidad').value;
    var cantTxt = (cant > 0) ? fmt(cant) + (unidad ? ' ' + unidad : '') : '';
    var frec = $('frecuencia').value.trim();
    var vol = parseFloat($('volumen').value);
    var volTxt = vol > 0 ? fmt(vol) + ($('volUnidad').value === 'L' ? ' L' : ' m³') : '';
    var origen = (c.cantidad != null && cant === c.cantidad)
      ? 'Cantidad calculada con la tabla de reglas BIOOMA v' + esc(R.version) + '.'
      : (cantTxt ? 'Cantidad definida manualmente por quien elabora el documento.' : '');
    var fecha = $('fecha').value ? new Date($('fecha').value + 'T00:00:00').toLocaleDateString('es-CO', {day:'numeric',month:'long',year:'numeric'}) : '';
    var pasos = (p.pasos || R.pasos).map(function(t){
      return '<li>' + esc(t)
        .replace('{cantidad}', '<b>' + (cantTxt ? esc(cantTxt) : 'cantidad por definir') + '</b>')
        .replace('{lugar}', '<b>' + (lug.length ? esc(lug.join(', ')) : 'lugar por definir') + '</b>')
        .replace('{frecuencia}', '<b>' + (frec ? esc(frec) : 'frecuencia por definir') + '</b>') + '</li>';
    }).join('');
    var sd = $('sinDiluir').checked, mezTxt = $('mezTexto').value.trim();
    var mezHtml;
    if (sd) mezHtml = '<p style="margin:0">Este producto se aplica <b>sin diluir</b>.</p>';
    else if (mezTxt) mezHtml = '<div class="mezTxt">' + esc(mezTxt) + '</div>';
    else mezHtml = '<p style="margin:0"><span class="pend">Proporción por definir</span></p>';
    var notasMez = mezclaRegla().notas;
    if (!sd && notasMez.length) mezHtml += '<ul style="margin-top:5px">' + notasMez.map(function(t){ return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>';
    var nota = $('notaAplicar').value.trim();
    var obs = $('obs').value.trim();

    $('hoja').innerHTML =
      (p.validado ? '' : '<div class="borrador">BORRADOR · Cantidades y pasos pendientes de validación técnica por BIOOMA</div>') +
      '<header class="enc"><img src="' + (LOGOS[p.logo] || '') + '" alt="' + esc(p.nombre) + '">' +
        '<div class="tit"><h2>Instrucciones de aplicación</h2><div class="prod">' + esc(p.nombre) + ' · ' + esc(s.etiqueta) + '</div></div></header>' +
      '<div class="contactos"><span>WhatsApp <b>' + R.contacto.whatsapp.map(esc).join(' · ') + '</b></span><span>Instagram y Facebook <b>' + esc(R.contacto.redes) + '</b></span><span>Web <b>' + esc(R.contacto.web) + '</b></span></div>' +
      '<section><h3>Cliente y sistema</h3><div class="grid3">' +
        '<div class="kv"><span>Cliente</span><b>' + val($('cliente').value.trim()) + '</b></div>' +
        '<div class="kv"><span>Sitio / ubicación</span><b>' + val($('sitio').value.trim()) + '</b></div>' +
        '<div class="kv"><span>Fecha</span><b>' + val(fecha) + '</b></div>' +
        '<div class="kv"><span>Tipo de sistema</span><b>' + esc(s.etiqueta) + '</b></div>' +
        '<div class="kv"><span>Volumen</span><b>' + val(volTxt) + '</b></div>' +
        '<div class="kv"><span>Elaborado por</span><b>' + val($('autor').value.trim()) + '</b></div>' +
        '<div class="kv" style="grid-column:1/-1"><span>Carga</span><b>' + esc(R.cargas[$('carga').value]) + ($('cargaDesc').value.trim() ? ' · ' + esc($('cargaDesc').value.trim()) : '') + '</b></div></div></section>' +
      '<section><h3>Plan de aplicación</h3><div class="plan">' +
        '<div class="kv"><span>Cantidad por aplicación</span><div class="big">' + (cantTxt ? esc(cantTxt) : '<span class="pend">Por definir</span>') + '</div></div>' +
        '<div class="kv"><span>Frecuencia</span><div class="big" style="font-size:14pt;padding-top:5px">' + (frec ? esc(frec) : '<span class="pend">Por definir</span>') + '</div></div>' +
        '<div class="kv" style="grid-column:1/-1"><span>Lugar de aplicación</span><b>' + (lug.length ? esc(lug.join(' · ')) : '<span class="pend">Por definir</span>') + '</b></div>' +
        (origen ? '<div class="src">' + origen + '</div>' : '') + '</div></section>' +
      '<section><h3>Cómo mezclar</h3>' + mezHtml + '</section>' +
      '<section><h3>Cómo aplicar</h3><ol>' + pasos + '</ol>' + (nota ? '<p class="nota"><b>Nota.</b> ' + esc(nota) + '</p>' : '') + '</section>' +
      '<section><h3>Almacenamiento</h3><p style="margin:0">' + esc(p.almacenamiento) + '</p></section>' +
      (obs ? '<section><h3>Observaciones</h3><p style="margin:0;white-space:pre-wrap">' + esc(obs) + '</p></section>' : '');
  }

  /* ---------- validación y PDF ---------- */
  function faltantes(){
    var f = [];
    if (!$('cliente').value.trim()) f.push('cliente');
    if (!(parseFloat($('volumen').value) > 0)) f.push('volumen del sistema');
    if (!(parseFloat($('cantidad').value) > 0)) f.push('cantidad por aplicación');
    if (!$('cantUnidad').value) f.push('unidad de la cantidad');
    if (!lugares().length) f.push('lugar de aplicación');
    if (!$('sinDiluir').checked && !$('mezTexto').value.trim()) f.push('proporción de mezcla');
    if (!$('frecuencia').value.trim()) f.push('frecuencia');
    return f;
  }
  var enVisor = !!(window.claude && window.claude.use);   // dentro de claude.ai no existe window.print()
  var slug = function(t){ return t.trim().replace(/[^\wÀ-ÿ]+/g, '-').replace(/^-|-$/g, ''); };
  function nombreArchivo(){ return 'Instrucciones-' + slug(prod().nombre) + '-' + slug($('cliente').value) + '-' + ($('fecha').value || '') + '.pdf'; }

  /* Hoja -> imagen -> PDF Letter. Los cortes de página caen al inicio de una sección. */
  async function crearPdf(){
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    var tops = [], PH = 1056, K = 2;
    var canvas = await html2canvas($('hoja'), { scale: K, backgroundColor: '#ffffff', useCORS: true, logging: false,
      onclone: function(doc){
        var h = doc.getElementById('hoja');
        h.style.zoom = '1'; h.style.boxShadow = 'none'; h.style.margin = '0'; h.style.width = '816px'; h.style.minHeight = PH + 'px';
        var base = h.getBoundingClientRect().top;
        [].forEach.call(h.querySelectorAll('section'), function(sec){ tops.push(Math.round(sec.getBoundingClientRect().top - base)); });
      } });
    var pdf = new window.jspdf.jsPDF({ unit: 'in', format: 'letter', orientation: 'portrait' });
    var total = canvas.height / K, start = 0, paginas = 0;
    while (start < total - 1){
      var end = Math.min(start + PH, total);
      if (end < total){
        var corte = tops.filter(function(t){ return t > start + 200 && t <= end; }).pop();
        if (corte) end = corte;
      }
      var tr = document.createElement('canvas'); tr.width = canvas.width; tr.height = PH * K;
      var cx = tr.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, tr.width, tr.height);
      cx.drawImage(canvas, 0, start * K, canvas.width, (end - start) * K, 0, 0, canvas.width, (end - start) * K);
      if (paginas) pdf.addPage();
      pdf.addImage(tr.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, 8.5, 11);
      start = end; paginas++;
    }
    return { blob: pdf.output('blob'), paginas: paginas };
  }
  window.biooma = { crearPdf: crearPdf };

  function aviso(ok, txt, html){
    $('err').className = 'err' + (!ok && txt ? ' on' : '');
    $('ok').className = 'ok' + (ok && txt ? ' on' : '');
    var el = ok ? $('ok') : $('err');
    if (html) el.innerHTML = html; else if (txt) el.textContent = txt;
  }
  var NO_DESCARGA = 'Esta vista no permite descargar archivos.';
  function noDescarga(){
    var u = R.urlWeb;
    aviso(false, NO_DESCARGA, u ? NO_DESCARGA + ' Use la versión web: <a href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(u) + '</a>' : '');
  }
  var MENSAJES = { declined: 'Descarga cancelada.', rate_limited: 'Espere unos segundos y vuelva a intentarlo.' };

  function imprimir(){
    var anterior = document.title;
    document.title = nombreArchivo().replace(/\.pdf$/, '');
    window.print();
    document.title = anterior;
  }

  $('pdf').onclick = async function(){
    var f = faltantes();
    if (f.length){ aviso(false, 'Falta completar: ' + f.join(', ') + '.'); return; }
    aviso(false, '');
    var btn = $('pdf'); btn.disabled = true; btn.textContent = 'Generando PDF…';
    try {
      if (enVisor){
        var dl = await window.claude.use('downloads');
        if (!dl){ noDescarga(); return; }
        await dl.save({ filename: nombreArchivo(), data: (await crearPdf()).blob });
      } else {
        if (!window.html2canvas || !window.jspdf){ imprimir(); return; }   // sin internet: usa la impresión del navegador
        var r = await crearPdf();
        var a = document.createElement('a');
        a.href = URL.createObjectURL(r.blob); a.download = nombreArchivo();
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function(){ URL.revokeObjectURL(a.href); }, 5000);
      }
      aviso(true, 'PDF generado: ' + nombreArchivo());
    } catch (e){
      if (e && (e.code === 'unavailable' || e.code === 'not_granted' || e.code === 'capability_disabled')) noDescarga();
      else aviso(false, (e && MENSAJES[e.code]) || 'No se pudo generar el PDF. Intente de nuevo.');
    } finally { btn.disabled = false; btn.textContent = 'Descargar PDF'; }
  };
  $('imprimir').onclick = function(){
    var f = faltantes();
    if (f.length){ aviso(false, 'Falta completar: ' + f.join(', ') + '.'); return; }
    aviso(false, ''); imprimir();
  };

  $('limpiar').onclick = function(){
    ['volumen','cargaDesc','cantidad','frecuencia','cliente','sitio','obs','notaAplicar'].forEach(function(id){ $(id).value = ''; });
    [].forEach.call(document.querySelectorAll('[data-lugar]'), function(c){ c.checked = false; }); $('lugarOtro').value = '';
    $('mezTexto').value = ''; $('sinDiluir').checked = false; mezclaTocada = false;
    $('cantUnidad').value = ''; cantidadTocada = frecuenciaTocada = false;
    aviso(false, ''); sync(); render();
  };

  /* ---------- eventos ---------- */
  $('producto').onchange = function(){ cantidadTocada = frecuenciaTocada = mezclaTocada = false; $('sinDiluir').checked = false; sync(); render(); };
  ['sistema','volumen','volUnidad','carga'].forEach(function(id){
    $(id).addEventListener('input', function(){ sync(); render(); });
  });
  $('cantidad').addEventListener('input', function(){ cantidadTocada = true; sync(); render(); });
  $('cantUnidad').addEventListener('input', render);
  $('lugares').addEventListener('change', render);
  $('mezTexto').addEventListener('input', function(){ mezclaTocada = true; sync(); render(); });
  $('sinDiluir').addEventListener('change', function(){ sync(); render(); });
  $('lugarOtro').addEventListener('input', render);
  $('frecuencia').addEventListener('input', function(){ frecuenciaTocada = true; render(); });
  ['cargaDesc','cliente','sitio','fecha','autor','obs','notaAplicar'].forEach(function(id){ $(id).addEventListener('input', render); });

  /* autor recordado en este navegador (comodidad, no es requisito) */
  try { $('autor').value = localStorage.getItem('biooma-autor') || ''; } catch(e){}
  $('autor').addEventListener('change', function(){ try { localStorage.setItem('biooma-autor', $('autor').value); } catch(e){} });

  var hoy = new Date(); $('fecha').value = hoy.getFullYear() + '-' + String(hoy.getMonth()+1).padStart(2,'0') + '-' + String(hoy.getDate()).padStart(2,'0');
  function ajustar(){
    var z = Math.min(1, $('stage').clientWidth / 816);
    $('hoja').style.zoom = z < 1 ? z : '';
  }
  window.addEventListener('resize', ajustar);
  $('pdfHint').textContent = enVisor ? 'Se generará el PDF y el visor le pedirá confirmar la descarga.' : 'El PDF se guarda en la carpeta de descargas de su dispositivo.';
  $('imprimir').hidden = enVisor;
  sync(); render(); ajustar();
})();
</script>
